<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAYWEAR — 데일리 캐주얼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="#" class="logo">DAYWEAR</a>
    <nav class="tabs" id="tabs"></nav>
    <button class="cart-btn" id="cartBtn" type="button">
      장바구니 <span class="badge" id="cartBadge" hidden>0</span>
    </button>
  </div>
</header>

<main class="container">
  <section class="banner">
    <p class="banner-eyebrow">2026 F/W DAILY COLLECTION</p>
    <h1>매일 꺼내 입는<br>기본의 기준</h1>
  </section>

  <div class="list-head">
    <h2 id="listTitle">전체</h2>
    <span class="count" id="listCount">16개 상품</span>
  </div>
  <ul class="grid" id="grid"></ul>
</main>

<div class="overlay" id="overlay"></div>

<!-- 상세 모달 -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mName" hidden>
  <button class="close" data-close type="button" aria-label="닫기">×</button>
  <div class="modal-img"><img id="mImg" alt=""></div>
  <div class="modal-info">
    <p class="cat" id="mCat"></p>
    <h3 id="mName"></h3>
    <p class="price" id="mPrice"></p>
    <p class="desc" id="mDesc"></p>

    <div class="opt">
      <p class="opt-label">색상 <span id="mColorSel"></span></p>
      <div class="chips" id="mColors"></div>
    </div>
    <div class="opt">
      <p class="opt-label">사이즈 <span id="mSizeSel"></span></p>
      <div class="chips" id="mSizes"></div>
    </div>
    <div class="opt">
      <p class="opt-label">수량</p>
      <div class="stepper">
        <button type="button" id="mMinus" aria-label="수량 감소">−</button>
        <span id="mQty">1</span>
        <button type="button" id="mPlus" aria-label="수량 증가">+</button>
      </div>
    </div>

    <p class="hint" id="mHint">색상과 사이즈를 선택해 주세요.</p>
    <button class="add-btn" id="mAdd" type="button" disabled>장바구니 담기</button>
  </div>
</div>

<!-- 장바구니 드로어 -->
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <div class="drawer-head">
    <h3 id="drawerTitle">장바구니 <span id="drawerCount"></span></h3>
    <button class="close" data-close type="button" aria-label="닫기">×</button>
  </div>
  <ul class="cart-list" id="cartList"></ul>
  <div class="cart-empty" id="cartEmpty">
    <p>장바구니가 비어 있어요</p>
    <button type="button" class="ghost-btn" data-close>쇼핑 계속하기</button>
  </div>
  <div class="drawer-foot" id="cartFoot">
    <div class="row"><span>총 수량</span><span id="sumQty">0개</span></div>
    <div class="row total"><span>합계</span><span id="sumPrice">0원</span></div>
    <a class="add-btn order-btn" id="orderBtn" href="checkout.html">주문하기</a>
  </div>
</aside>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
