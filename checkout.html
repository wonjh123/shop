<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문/결제 — DAYWEAR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">DAYWEAR</a>
    <p class="step">장바구니 › <b>주문/결제</b> › 완료</p>
  </div>
</header>

<main class="container pay-page">
  <h1 class="pay-title">주문/결제</h1>

  <div class="notice" id="notice" hidden></div>

  <div class="pay-layout" id="payLayout" hidden>
    <section>
      <h2 class="sec-title">주문 상품 <span id="orderCount"></span></h2>
      <ul class="order-list" id="orderList"></ul>

      <h2 class="sec-title">결제 수단</h2>
      <div id="payment-method"></div>
      <div id="agreement"></div>
    </section>

    <aside class="summary">
      <h2 class="sec-title">결제 금액</h2>
      <div class="row"><span>상품 금액</span><span id="sumGoods">0원</span></div>
      <div class="row"><span>배송비</span><span>무료</span></div>
      <div class="row total"><span>최종 결제 금액</span><span id="sumTotal">0원</span></div>
      <button class="add-btn pay-btn" id="payBtn" type="button" disabled>결제 수단 불러오는 중…</button>
      <p class="test-note">테스트 결제 환경입니다. 실제로 돈이 빠져나가지 않습니다.</p>
      <a class="back-link" href="index.html">← 쇼핑 계속하기</a>
    </aside>
  </div>
</main>

<script src="data.js"></script>
<script src="checkout.js"></script>
</body>
</html>
